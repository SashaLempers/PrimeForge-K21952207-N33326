name: validate-publication

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate metadata, hashes, links, safety, and exact proof
        run: python scripts/validate_publication.py --full
      - name: Rebuild release archive twice
        shell: bash
        run: |
          python scripts/build_release.py
          first=$(sha256sum release/PrimeForge-K21952207-N33326-artifacts.zip | cut -d' ' -f1)
          python scripts/build_release.py
          second=$(sha256sum release/PrimeForge-K21952207-N33326-artifacts.zip | cut -d' ' -f1)
          test "$first" = "$second"
